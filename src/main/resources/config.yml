# ╔══════════════════════════════════════════╗
# ║         LoveAuth — Конфигурация          ║
# ╚══════════════════════════════════════════╝

# ── База данных ─────────────────────────────
database:
  # Имя файла SQLite (будет создан в папке плагина)
  file: "loveauth.db"

# ── Безопасность ────────────────────────────
security:
  # Pepper добавляется к паролю перед Argon2-хэшированием.
  # Генерируется автоматически при первом запуске — НЕ МЕНЯТЬ после создания аккаунтов!
  pepper: ""
  # AES-256-GCM ключ для шифрования чувствительных данных в БД.
  # Генерируется автоматически при первом запуске — НЕ МЕНЯТЬ!
  master-key: ""
  # Количество итераций Argon2id (10-14 рекомендуется; выше = медленнее, но безопаснее)
  argon2-iterations: 10
  # Объём памяти для Argon2id в килобайтах (65536 = 64 МБ; больше = безопаснее, но требует больше ОЗУ)
  argon2-memory-kb: 65536
  # Количество параллельных потоков для Argon2id (1 рекомендуется для большинства серверов)
  argon2-parallelism: 1

# ── Сессии ──────────────────────────────────
session:
  # Включить сессии (false = вводить пароль при каждом входе)
  enabled: true
  # Длительность сессии в днях (1–28); 0 = сессии отключены
  duration-days: 7
  # Сбрасывать сессию при смене IP-адреса
  bind-to-ip: true

# ── Авторизация ─────────────────────────────
auth:
  # Секунд на прохождение авторизации/регистрации (после — кик)
  timeout-seconds: 90
  # Максимум неверных попыток ввода пароля до блокировки IP
  max-attempts: 3
  # Время блокировки IP в минутах после исчерпания попыток
  lockout-duration-minutes: 60
  # Минимальная длина пароля игрока (3-25)
  min-password-length: 6
  # Пропускать авторизацию для лицензионных игроков
  premium-skip: true
  # Задержка (в тиках) открытия меню входа/регистрации после МЕЖМИРОВОГО телепорта в limbo
  # (2026-10-07). Через 1 тик клиент ещё на экране загрузки мира и сам шлёт пакет закрытия
  # окна — игрока кикало за «закрытое меню», которого он даже не видел. 10 тиков (0.5 с)
  # хватает, чтобы экран загрузки ушёл. Телепорт внутри того же мира — по-прежнему 1 тик.
  menu-open-delay-ticks: 10
  # Окно (мс) после открытия меню, в течение которого закрытие меню не кикает, а открывает
  # его заново (2026-10-07). Закрытие на медленном клиенте может прийти позже задержки выше;
  # 2 секунды покрывают загрузку мира, а осознанное закрытие позже — по-прежнему кик.
  close-grace-ms: 2000

# ── Протокольная проверка лицензии ───────────
# Реальная криптографическая проверка лицензионности через хендшейк Mojang.
premium-verification:
  # Включить протокольную проверку (по умолчанию выключено — опасная фича)
  enabled: true
  # Сколько миллисекунд ждать ответа клиента на каждом шаге хендшейка
  timeout-ms: 5000
  # Запрещать вход с нелицензии под ником, который на этом сервере уже
  # зарегистрирован как лицензионный аккаунт (т.е. однажды зашёл с лицензии).
  # Ник, который ещё никогда не регистрировался, никогда не блокируется -
  # первый вход сам определяет тип аккаунта (лицензия/пиратка) на будущее.
  # Работает только когда протокольная проверка активна.
  block-cracked-with-premium-name: true

# ── Очередь ─────────────────────────────────
queue:
  # Включить систему очереди
  enabled: false
  # Максимум игроков онлайн (при достижении — остальные в очередь)
  max-players: 100

# ── Limbo-мир ───────────────────────────────
limbo:
  # Включить Limbo-мир (если false — игрок остаётся на месте спавна)
  enabled: true
  # Название void-мира для неавторизованных игроков
  world-name: "loveauth_limbo"
  # Мир, на спавн которого отправляется авторизовавшийся игрок, если он стоит в limbo, а точка
  # возврата потеряна (2026-10-07: игроки застревали в limbo после выхода с открытым меню).
  # Пусто — берётся register-spawn.world, если такого мира нет — первый мир, не являющийся limbo.
  fallback-world: ""

# ── Телепорт после регистрации ──────────────
# Телепортировать игрока на спавн указанного мира (в режиме SURVIVAL) после ПЕРВОЙ
# регистрации (повторные входы телепорт не затрагивают — игрок остаётся там, где был,
# с тем же режимом игры).
register-spawn:
  enabled: false
  world: "spawn"
  # Точная локация первого спавна (ставится командой /loveauthadmin setfirstspawn,
  # добавлено 2026-09-23 по запросу владельца). Если "world" здесь пуст — используется
  # спавн мира из "world" выше (старое поведение, координаты не заданы вручную).
  location:
    world: ""
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

# ── Discord-интеграция ───────────────────────
discord:
  # Включить возможность входа/привязки через Discord-бота
  enabled: true
  # Токен Discord-бота (требуется если enabled: true)
  bot-token: ''
  # ID сервера Discord
  guild-id: ''
  # Категория Discord для тикетов апелляций/поддержки/репортов, создаваемых через LoveCore
  # DiscordService (LoveWebAdmin и т.п.) — заполняются, только если этот бот взял на себя
  # тикеты всей экосистемы (см. tickets-bridge.enabled ниже).
  appeals-category-id: ''
  support-category-id: ''
  # Тикет-мост: когда включено, этот бот (LoveAuth) может использоваться как запасной
  # DiscordService в LoveCore, если в самом LoveCore Discord выключен или не настроен.
  # По умолчанию выключено (false), чтобы не переопределять полноценный DiscordService
  # самого LoveCore (ensureMessage, интерактивные панели тикетов LoveWebAdmin и др.).
  tickets-bridge:
    enabled: false
  # Статус бота «Играет: N/M» с онлайном сервера.
  # 2026-10-18: владелец попросил показывать онлайн прямо в профиле бота. Число читается на main
  # thread (Bukkit.getOnlinePlayers()) повторяющейся задачей и отправляется в Discord, только когда
  # текст изменился. Интервал 60 с выбран потому, что Discord ограничивает смену статуса (около 5
  # раз за 20 секунд на шлюзе), а онлайн в профиле бота не требует секундной точности; меньше 10 с
  # плагин не разрешает. Плейсхолдеры: {online} и {max}.
  presence:
    enabled: true
    format: "Играет: {online}/{max}"
    interval-seconds: 60

# ── Меню аккаунта ────────────────────────────
# Настройки GUI "/loveauth account" в режиме встраивания в чужое меню
# (открыто со скрытым аргументом, напр. "[player] auth account mainmenu"
# из кнопки DeluxeMenus — см. пример player_profile.yml с btn_account).
# Без скрытого аргумента ("/loveauth account" сам по себе) меню всегда
# самостоятельное — без головы профиля и без кнопки "Назад", эти настройки
# на него не влияют.
gui:
  account:
    # Показывать голову профиля (слот 0) в режиме встраивания
    show-profile: true
    # Команда (без слэша), которая выполняется по клику на "Назад" в режиме
    # встраивания — обычно команда открытия того меню, откуда пришли
    back-command: "menu open main_menu"

# ── Язык ────────────────────────────────────
# Файл языка: plugins/LoveAuth/lang/lang.yml
language: "lang"

# ── Пасхалки ────────────────────────────────
# 2026-10-30: годовщина регистрации. Вход ровно в день и месяц первой регистрации (не раньше чем через год)
# запускает частицы, звук и титул «С годовщиной!»; каждый год отмечается один раз, сколько бы раз игрок
# ни заходил в этот день. Ракеты-сущности не используются: их взрыв ранит игрока. Эффект запускается
# через delay-ticks после входа — вход возвращает игрока на место и в режим игры с задержкой в тик-два,
# и 20 тиков (секунда) с запасом переживают эту перестановку (минимум 5).
easter-eggs:
  anniversary:
    enabled: true
    delay-ticks: 20
