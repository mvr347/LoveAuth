# ── GUI: общие ──────────────────────────────
# Оформление по gui_gen v2.1 (как в LoveClans и LoveShop): названия без значков и жирного, первая строка
# лора — подзаголовок категории, секции «▪ …» с отступом в два пробела. Клики и блок недоступной кнопки
# собирает LoreBlocks из gui.style.* — здесь их не пишем. Курсив снимает HeadTextures.upright.
# Эмодзи не используем: разные шрифты клиента рисуют их разной ширины.
gui:
  # Общие строки лора (gui_gen v2.1): разделитель, клики, блок недоступной кнопки. Собирает LoreBlocks.
  style:
    separator: "<dark_gray><st>─────────────────────</st>"
    click:
      left: "<green>ЛКМ <dark_gray>— <gray>{action}"
      right: "<gold>ПКМ <dark_gray>— <gray>{action}"
    reason: "<red>Причина: <gray>{reason}"
    blocked-click: "<dark_gray>{click} — {action} (заблокировано)"
    status:
      unavailable: "<red>✕ Действие недоступно"
  close-button: "<red>Закрыть"
  back-button: "<gray>Назад"
  confirm-button: "<green>Подтвердить"
  cancel-button: "<red>Отмена"
  confirm-action: "подтвердить"
  cancel-action: "отменить"
  confirm-lore:
    - "<dark_gray>Подтверждение"
    - ""
    - "<gray>Действие будет выполнено сразу."
  cancel-lore:
    - "<dark_gray>Отмена"
    - ""
    - "<gray>Ничего не изменится."
  filler-name: " "
  unavailable: "<red>Недоступно"
  player-head: "<gold>Профиль <dark_gray>| <white>{player}</white>"

